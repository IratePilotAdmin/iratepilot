name: Revenue supervisor lock-wait authorization gate
on:
  workflow_dispatch:
    inputs:
      fixture_manifest:
        description: Fresh installed isolated lock-wait fixture JSON with scheduled start
        type: string
        required: true
      publishable_key:
        description: Pinned isolated publishable key
        type: string
        required: true
      supervised_cleanup:
        description: Operator present for timed SQL holders, restores, audit and cleanup
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: revenue-signed-http-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/revenue-ai-forecast-evidence-20260930' && inputs.supervised_cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: revenue-http-qualification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Validate preparation without credentials
        run: node --test scripts/tests/*.node-test.mjs
      - name: Prepare scheduled isolated manifest
        env:
          FIXTURE_JSON: ${{ inputs.fixture_manifest }}
          IRP_REVIEW_FIXTURE_PATH: ${{ runner.temp }}/supervisor-lockwait.json
          IRP_REVIEW_PUBLISHABLE_KEY: ${{ inputs.publishable_key }}
          IRP_REVIEW_SUPERVISED_CLEANUP: "1"
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.env.IRP_REVIEW_FIXTURE_PATH,JSON.stringify(JSON.parse(process.env.FIXTURE_JSON)),{mode:0o600,flag:"wx"});'
          node scripts/qualify-supervisor-lockwait.mjs --preflight
      - name: Genuine Auth lock-wait and reauthorization checks
        env:
          IRP_REVIEW_FIXTURE_PATH: ${{ runner.temp }}/supervisor-lockwait.json
          IRP_REVIEW_PUBLISHABLE_KEY: ${{ inputs.publishable_key }}
          IRP_REVIEW_SUPERVISED_CLEANUP: "1"
          IRP_REVIEW_MANAGER_EMAIL: ${{ secrets.IRP_HTTP_TEST_MANAGER_EMAIL }}
          IRP_REVIEW_MANAGER_PASSWORD: ${{ secrets.IRP_HTTP_TEST_MANAGER_PASSWORD }}
        run: node scripts/qualify-supervisor-lockwait.mjs
      - name: Retain scoped HTTP evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supervisor-lockwait-evidence
          path: work/supervisor-lockwait-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Remove local manifest
        if: always()
        run: rm -f -- "$RUNNER_TEMP/supervisor-lockwait.json"
# Operator must execute exact generated cleanup.sql after every outcome.
# Runner has no database administrator credentials and cannot remove the fixture.
