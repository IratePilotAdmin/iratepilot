name: Revenue Auth audited-write HTTP release gate

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Isolated qualification suite (fresh fixture required)
        type: choice
        required: true
        default: audited-http
        options:
          - audited-http
          - browser-recovery
          - pms-panel
          - supervisor-review
          - supervisor-queue
      fixture_manifest:
        description: Supervisor mode only - fresh installed fixture JSON
        type: string
        required: false
      publishable_key:
        description: Supervisor mode only - isolated branch publishable key
        type: string
        required: false
      supervised_cleanup:
        description: Supervisor mode only - operator present for audit and scoped cleanup
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: revenue-signed-http-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/revenue-ai-forecast-evidence-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: revenue-http-qualification
    steps:
      - name: Check out reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ (inputs.gate == 'supervisor-review' || inputs.gate == 'supervisor-queue' || inputs.gate == 'audited-http') && github.sha || '10164279cf57af50d64311d1d1b0e4c96d5be86f' }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        if: inputs.gate != 'supervisor-review' && inputs.gate != 'supervisor-queue'
        run: npm ci --ignore-scripts
      - name: Install isolated browser tools
        if: inputs.gate == 'browser-recovery' || inputs.gate == 'pms-panel'
        run: |
          npm ci --ignore-scripts --prefix scripts/revenue-browser-tools
          node scripts/revenue-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Validate isolated branch manifest
        if: inputs.gate != 'supervisor-review' && inputs.gate != 'supervisor-queue'
        env:
          IRP_HTTP_QUALIFICATION_MANIFEST: ${{ vars.IRP_HTTP_QUALIFICATION_MANIFEST }}
        run: node scripts/revenue-http-qualification-preflight.mjs
      - name: Run 28 Auth-issued isolated audited-write HTTP cases
        if: inputs.gate == 'audited-http'
        env:
          IRP_RUN_SIGNED_HTTP_WRITE_QUALIFICATION: "1"
          IRP_HTTP_TEST_OWNER_EMAIL: ${{ secrets.IRP_HTTP_TEST_OWNER_EMAIL }}
          IRP_HTTP_TEST_OWNER_PASSWORD: ${{ secrets.IRP_HTTP_TEST_OWNER_PASSWORD }}
          IRP_HTTP_TEST_MANAGER_EMAIL: ${{ secrets.IRP_HTTP_TEST_MANAGER_EMAIL }}
          IRP_HTTP_TEST_MANAGER_PASSWORD: ${{ secrets.IRP_HTTP_TEST_MANAGER_PASSWORD }}
          IRP_HTTP_TEST_STAFF_EMAIL: ${{ secrets.IRP_HTTP_TEST_STAFF_EMAIL }}
          IRP_HTTP_TEST_STAFF_PASSWORD: ${{ secrets.IRP_HTTP_TEST_STAFF_PASSWORD }}
        run: |
          node scripts/revenue-http-qualification-preflight.mjs --credentials
          node node_modules/vitest/vitest.mjs run tests/revenue-signed-write-http.integration.test.ts
      - name: Run 12 Auth-issued isolated Chromium recovery cases
        if: inputs.gate == 'browser-recovery'
        env:
          IRP_RUN_AUTH_BROWSER_RECOVERY: "1"
          IRP_HTTP_TEST_OWNER_EMAIL: ${{ secrets.IRP_HTTP_TEST_OWNER_EMAIL }}
          IRP_HTTP_TEST_OWNER_PASSWORD: ${{ secrets.IRP_HTTP_TEST_OWNER_PASSWORD }}
          IRP_HTTP_TEST_MANAGER_EMAIL: ${{ secrets.IRP_HTTP_TEST_MANAGER_EMAIL }}
          IRP_HTTP_TEST_MANAGER_PASSWORD: ${{ secrets.IRP_HTTP_TEST_MANAGER_PASSWORD }}
          IRP_HTTP_TEST_STAFF_EMAIL: ${{ secrets.IRP_HTTP_TEST_STAFF_EMAIL }}
          IRP_HTTP_TEST_STAFF_PASSWORD: ${{ secrets.IRP_HTTP_TEST_STAFF_PASSWORD }}
        run: |
          node scripts/revenue-http-qualification-preflight.mjs --credentials
          node scripts/qualify-revenue-auth-browser-recovery.mjs
      - name: Run 18 isolated Auth-issued private PMS panel cases
        if: inputs.gate == 'pms-panel'
        env:
          IRP_RUN_AUTH_BROWSER_RECOVERY: "1"
          IRP_HTTP_TEST_OWNER_EMAIL: ${{ secrets.IRP_HTTP_TEST_OWNER_EMAIL }}
          IRP_HTTP_TEST_OWNER_PASSWORD: ${{ secrets.IRP_HTTP_TEST_OWNER_PASSWORD }}
          IRP_HTTP_TEST_MANAGER_EMAIL: ${{ secrets.IRP_HTTP_TEST_MANAGER_EMAIL }}
          IRP_HTTP_TEST_MANAGER_PASSWORD: ${{ secrets.IRP_HTTP_TEST_MANAGER_PASSWORD }}
          IRP_HTTP_TEST_STAFF_EMAIL: ${{ secrets.IRP_HTTP_TEST_STAFF_EMAIL }}
          IRP_HTTP_TEST_STAFF_PASSWORD: ${{ secrets.IRP_HTTP_TEST_STAFF_PASSWORD }}
        run: |
          node scripts/revenue-http-qualification-preflight.mjs --credentials
          node scripts/qualify-revenue-auth-browser-recovery.mjs --pms-panel
      - name: Require supervised cleanup for supervisor mode
        if: (inputs.gate == 'supervisor-review' || inputs.gate == 'supervisor-queue') && !inputs.supervised_cleanup
        run: exit 1
      - name: Check queue fixture preparation without credentials
        if: inputs.gate == 'supervisor-queue'
        run: node --test scripts/tests/supervisor-queue-preparation.node-test.mjs
      - name: Write non-secret supervisor manifest and preflight
        if: (inputs.gate == 'supervisor-review' || inputs.gate == 'supervisor-queue') && inputs.supervised_cleanup
        env:
          QUEUE_MODE: ${{ inputs.gate == 'supervisor-queue' && '1' || '0' }}
          FIXTURE_JSON: ${{ inputs.fixture_manifest }}
          IRP_REVIEW_FIXTURE_PATH: ${{ runner.temp }}/supervisor-review-fixture.json
          IRP_REVIEW_PUBLISHABLE_KEY: ${{ inputs.publishable_key }}
          IRP_REVIEW_SUPERVISED_CLEANUP: "1"
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; const f=JSON.parse(process.env.FIXTURE_JSON); writeFileSync(process.env.IRP_REVIEW_FIXTURE_PATH, JSON.stringify(f), {mode:0o600, flag:"wx"});'
          if [ "$QUEUE_MODE" = "1" ]; then node scripts/qualify-supervisor-queue-recovery.mjs --preflight; else node scripts/qualify-supervisor-review-race.mjs --preflight; fi
      - name: Run genuine Auth supervisor claim, denial and receipt checks
        if: (inputs.gate == 'supervisor-review' || inputs.gate == 'supervisor-queue') && inputs.supervised_cleanup
        env:
          QUEUE_MODE: ${{ inputs.gate == 'supervisor-queue' && '1' || '0' }}
          IRP_REVIEW_FIXTURE_PATH: ${{ runner.temp }}/supervisor-review-fixture.json
          IRP_REVIEW_PUBLISHABLE_KEY: ${{ inputs.publishable_key }}
          IRP_REVIEW_SUPERVISED_CLEANUP: "1"
          IRP_REVIEW_OWNER_EMAIL: ${{ secrets.IRP_HTTP_TEST_OWNER_EMAIL }}
          IRP_REVIEW_OWNER_PASSWORD: ${{ secrets.IRP_HTTP_TEST_OWNER_PASSWORD }}
          IRP_REVIEW_MANAGER_EMAIL: ${{ secrets.IRP_HTTP_TEST_MANAGER_EMAIL }}
          IRP_REVIEW_MANAGER_PASSWORD: ${{ secrets.IRP_HTTP_TEST_MANAGER_PASSWORD }}
          IRP_REVIEW_STAFF_EMAIL: ${{ secrets.IRP_HTTP_TEST_STAFF_EMAIL }}
          IRP_REVIEW_STAFF_PASSWORD: ${{ secrets.IRP_HTTP_TEST_STAFF_PASSWORD }}
        run: |
          if [ "$QUEUE_MODE" = "1" ]; then node scripts/qualify-supervisor-queue-recovery.mjs; else node scripts/qualify-supervisor-review-race.mjs; fi
      - name: Remove local manifest
        if: always()
        run: rm -f -- "$RUNNER_TEMP/revenue-http-qualification.json" "$RUNNER_TEMP/supervisor-review-fixture.json"

# Install the pinned expiring fixture only on the isolated branch before approval.
# Operator must run scripts/revenue-audited-http-fixture-cleanup.sql after any result.
# Runner has no database admin credentials; removal above is only the local manifest.


